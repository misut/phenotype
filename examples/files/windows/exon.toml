[package]
name = "files-windows"
version = "0.1.0"
description = "Windows native Files example for phenotype"
authors = ["misut"]
license = "MIT"
type = "bin"
standard = 23
platforms = [{ os = "windows", arch = "x86_64" }]

[sync]
cmake-in-root = false

[dependencies.path]
phenotype-core = "../../../core"
phenotype-windows = "../../../windows"

[target.'cfg(os = "windows")'.build]
ldflags = ["/SUBSYSTEM:WINDOWS", "/ENTRY:mainCRTStartup"]
